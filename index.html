<style>
/* Mise en page : carnet de sciences façon manuel québécois — onglets moutarde, étiquettes lime, pointillés. */
:root {
  --paper: #fffaf0; --card: #ffffff; --ink: #2b2520; --ink-soft: #6b5f53; --line: #eadfca; --dot: #cdbd98;
  --mustard: #e6ac2e; --mustard-soft: #fbedc8; --lime: #b8d05a; --lime-soft: #eef5d3; --teal: #2b8a84; --teal-soft: #d8efec;
  --ok: #2e9a58; --ok-soft: #dcf3e4; --bad: #d9503f; --bad-soft: #fbe2dd; --tile: #fff4d9; --on-color: #2b2520; --star: #f2b01e; --focus: #1f6fd1;
  --f-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Andika", "Verdana", system-ui, sans-serif;
  --f-hand: "Patrick Hand", "Comic Sans MS", "Chalkboard SE", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1d211b; --card: #282e26; --ink: #f4eddf; --ink-soft: #c3b8a5; --line: #3b4337; --dot: #5d654f;
  --mustard-soft: #4a3b17; --lime-soft: #33401a; --teal-soft: #1f3e3b; --ok-soft: #1f3d2a; --bad-soft: #4a241f; --tile: #f3ead2; --focus: #7db3ff; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #1d211b; --card: #282e26; --ink: #f4eddf; --ink-soft: #c3b8a5; --line: #3b4337; --dot: #5d654f;
  --mustard-soft: #4a3b17; --lime-soft: #33401a; --teal-soft: #1f3e3b; --ok-soft: #1f3d2a; --bad-soft: #4a241f; --tile: #f3ead2; --focus: #7db3ff; color-scheme: dark; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 18px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
#view:focus, #view:focus-visible { outline: none; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; line-height: 1.15; text-wrap: balance; margin: 0; }

/* En-tête */
.top { padding-block: 18px 6px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.doc-tab { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-display); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; background: var(--ink); color: var(--paper); border-radius: 8px; padding: 4px 9px; }
.top h1 { font-size: clamp(26px, 6vw, 38px); background: var(--mustard); color: var(--on-color); padding: 6px 16px 8px; border-radius: 14px 18px 14px 20px; transform: rotate(-1deg); }
.overall { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-size: 15px; color: var(--ink-soft); }
.overall .bar { width: 120px; }
.bar { height: 12px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 99px; transition: width .5s ease; }

/* Navigation */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 8px; margin-inline: -4px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav button { flex: 0 0 auto; padding-left: 14px; border: 2px solid var(--line); background: var(--card); border-radius: 99px; padding-block: 6px; padding-right: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer; font-family: var(--f-display); font-size: 15px; white-space: nowrap; min-height: 44px; }
.nav button:has(.ic) { padding-left: 8px; }
.nav button .ic { width: 30px; height: 30px; background: var(--tile); border-radius: 50%; padding: 2px; }
.nav button[aria-current="page"] { border-color: var(--ink); background: var(--mustard-soft); }
.nav .mini-stars { font-size: 12px; color: var(--star); letter-spacing: -1px; }

/* Accueil */
.hello { margin-block: 14px 18px; font-family: var(--f-hand); font-size: 22px; color: var(--ink-soft); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.lcard { text-align: left; border: 2.5px dotted var(--dot); background: var(--card); border-radius: 20px; padding: 16px; display: grid; grid-template-columns: 72px 1fr; gap: 6px 14px; align-items: center; cursor: pointer; transition: transform .15s ease; min-width: 0; }
.lcard:hover { transform: translateY(-2px) rotate(-.4deg); }
.lcard .big { grid-row: span 3; width: 72px; height: 72px; border-radius: 50%; background: var(--tile); padding: 4px; }
.lcard h2 { font-size: 21px; }
.lcard .pg { font-family: var(--f-hand); font-size: 17px; color: var(--ink-soft); }
.lcard .meta { display: flex; align-items: center; gap: 10px; }
.lcard .meta .bar { flex: 1; }
.num { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--paper); font-family: var(--f-display); font-size: 15px; margin-right: 6px; vertical-align: 2px; }
.stars { color: var(--star); font-size: 20px; letter-spacing: 1px; white-space: nowrap; }
.stars .off { color: var(--line); }
.rev { margin-top: 18px; border: 2.5px solid var(--teal); background: var(--teal-soft); border-radius: 20px; padding: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.rev h2 { font-size: 21px; }
.rev p { margin: 2px 0 0; color: var(--ink-soft); }
.foot { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; color: var(--ink-soft); font-size: 15px; }

/* Leçon */
.lhead { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; margin-block: 14px 12px; }
.lhead .big { width: 64px; height: 64px; border-radius: 50%; background: var(--tile); padding: 4px; flex: 0 0 auto; }
.lhead .t { flex: 1 1 220px; min-width: 0; }
.lhead h2 { font-size: clamp(24px, 5vw, 32px); }
.lhead .pg { font-family: var(--f-hand); font-size: 18px; color: var(--ink-soft); }
.lprog { flex: 1 1 100%; display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-size: 14px; color: var(--ink-soft); }
.lprog .bar { flex: 1; }
.retenir { background: var(--lime-soft); border-radius: 18px; padding: 14px 16px 14px 18px; margin-bottom: 18px; position: relative; }
.retenir h3 { font-family: var(--f-hand); font-size: 22px; font-weight: 400; display: inline-block; background: var(--lime); color: var(--on-color); padding: 0 10px; border-radius: 6px; transform: rotate(-1.5deg); margin-bottom: 6px; }
.retenir ul { margin: 4px 0 0; padding-left: 20px; }
.retenir li { margin: 4px 0; }
.act { background: var(--card); border: 2.5px dotted var(--dot); border-radius: 22px; padding: 16px; margin-bottom: 18px; }
.act.done { border-style: solid; border-color: var(--ok); }
.act-h { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; margin-bottom: 6px; }
.act-h h3 { font-size: 21px; }
.act-h .tag { font-family: var(--f-display); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
.act-h .check { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--line); display: grid; place-items: center; font-weight: 700; color: transparent; }
.act.done .act-h .check { background: var(--ok); border-color: var(--ok); color: #fff; }
.help { margin: 0 0 12px; color: var(--ink-soft); font-size: 16px; }
.fb { margin-top: 12px; border-radius: 14px; padding: 10px 14px; font-size: 17px; display: none; }
.fb.show { display: block; animation: pop .25s ease; }
.fb.ok { background: var(--ok-soft); border-left: 6px solid var(--ok); }
.fb.bad { background: var(--bad-soft); border-left: 6px solid var(--bad); }
.fb.info { background: var(--mustard-soft); border-left: 6px solid var(--mustard); }
.fb b { font-family: var(--f-display); font-weight: 600; }
@keyframes pop { from { transform: scale(.97); opacity: .3; } to { transform: none; opacity: 1; } }
.btn { border: 0; background: var(--ink); color: var(--paper); font-family: var(--f-display); font-size: 17px; padding: 10px 18px; border-radius: 99px; cursor: pointer; min-height: 46px; }
.btn.alt { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
.btn.mus { background: var(--mustard); color: var(--on-color); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.next-l { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 8px; }

/* Cartes à retourner */
.flips { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.flip { perspective: 900px; border: 0; background: none; padding: 0; cursor: pointer; min-height: 190px; text-align: center; }
.flip .in { position: relative; display: block; width: 100%; height: 100%; min-height: 190px; transition: transform .55s cubic-bezier(.3,1.4,.6,1); transform-style: preserve-3d; }
.flip.on .in { transform: rotateY(180deg); }
.flip .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.flip .front { background: var(--mustard-soft); border: 2.5px solid var(--mustard); }
.flip .front .ics { display: flex; gap: 4px; }
.flip .front .ics svg { width: 70px; height: 70px; background: var(--tile); border-radius: 50%; padding: 4px; }
.flip .front strong { font-family: var(--f-display); font-weight: 600; font-size: 19px; }
.flip .front small { font-family: var(--f-hand); font-size: 15px; color: var(--ink-soft); }
.flip .back { background: var(--teal-soft); border: 2.5px solid var(--teal); transform: rotateY(180deg); font-size: 16.5px; line-height: 1.35; }
.flip.seen .front::after { content: "✓"; position: absolute; top: 8px; right: 12px; color: var(--ok); font-weight: 700; }

/* Tri / association / étiquettes */
.tray { display: flex; flex-wrap: wrap; gap: 10px; min-height: 64px; padding: 10px; border-radius: 16px; background: var(--paper); border: 2px dashed var(--line); margin-bottom: 12px; }
.tray:empty::after { content: "Tout est rangé !"; font-family: var(--f-hand); font-size: 20px; color: var(--ok); padding: 6px; }
.chip { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 2.5px solid var(--ink); border-radius: 14px; padding: 6px 12px 6px 6px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; font-size: 17px; max-width: 100%; text-align: left; min-height: 48px; }
.chip.txt { padding: 8px 12px; }
.chip svg { width: 44px; height: 44px; flex: 0 0 auto; background: var(--tile); border-radius: 50%; padding: 2px; }
.chip.sel { background: var(--mustard-soft); border-color: var(--mustard); box-shadow: 0 0 0 3px var(--mustard); transform: translateY(-2px); }
.chip.placed { cursor: default; border-color: var(--ok); background: var(--ok-soft); font-size: 15.5px; min-height: 40px; }
.chip.placed svg { width: 34px; height: 34px; }
.chip.shake { animation: shake .4s ease; border-color: var(--bad); }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
.ghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -60%) rotate(-3deg) scale(1.05); box-shadow: 0 10px 24px rgba(0,0,0,.25); }
.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.bin { border: 2.5px dashed var(--dot); border-radius: 18px; padding: 10px; min-height: 110px; background: var(--paper); cursor: pointer; display: flex; flex-direction: column; gap: 8px; transition: background .15s, border-color .15s; min-width: 0; }
.bin .bh { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 600; font-size: 18px; }
.bin .bh svg { width: 40px; height: 40px; background: var(--tile); border-radius: 50%; padding: 2px; flex: 0 0 auto; }
.bin .bh small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 14px; color: var(--ink-soft); }
.bin .got { display: flex; flex-wrap: wrap; gap: 6px; }
.bin.hot { background: var(--mustard-soft); border-color: var(--mustard); border-style: solid; }
.bin.ready { border-color: var(--mustard); }
.bins.match .bin { min-height: 80px; }
.bins.match .bin .bh { font-family: var(--f-body); font-weight: 700; font-size: 16.5px; }
.diagram { position: relative; max-width: 620px; margin: 0 auto 10px; background: var(--tile); border-radius: 18px; padding: 8px; }
.diagram svg { display: block; }
.spot { position: absolute; transform: translate(-50%, -50%); min-width: 46px; min-height: 46px; border-radius: 99px; border: 3px dashed var(--mustard); background: rgba(255,250,240,.92); color: #2b2520; font-family: var(--f-display); font-size: 18px; display: grid; place-items: center; padding: 2px 10px; cursor: pointer; white-space: nowrap; }
.spot.hot { background: var(--mustard); border-style: solid; }
.spot.filled { border: 3px solid var(--ok); background: #dcf3e4; font-family: var(--f-body); font-weight: 700; font-size: 15px; }

/* Vrai ou faux */
.tf { display: grid; gap: 10px; }
.tfi { border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; }
.tfi p { margin: 0 0 8px; font-size: 18px; }
.tfi .row button { min-width: 96px; }
.tfi.ok { border-color: var(--ok); background: var(--ok-soft); }
.tfi.bad { border-color: var(--bad); background: var(--bad-soft); }
.tfi .why { margin-top: 8px; font-size: 16px; }
.vf { border: 2.5px solid var(--ink); background: var(--card); border-radius: 99px; padding: 8px 16px; font-family: var(--f-display); font-size: 17px; cursor: pointer; min-height: 46px; }
.vf.pick-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.vf.pick-bad { background: var(--bad); border-color: var(--bad); color: #fff; }

/* Ordre */
.order-slots { display: grid; gap: 8px; margin-bottom: 12px; counter-reset: s; }
.oslot { display: flex; align-items: center; gap: 10px; min-height: 52px; border: 2.5px dashed var(--dot); border-radius: 14px; padding: 6px 12px; color: var(--ink-soft); }
.oslot b { display: grid; place-items: center; width: 32px; height: 32px; flex: 0 0 auto; border-radius: 50%; background: var(--line); color: var(--ink); font-family: var(--f-display); }
.oslot.filled { border-style: solid; border-color: var(--ok); background: var(--ok-soft); color: var(--ink); animation: pop .25s ease; }
.oslot.filled b { background: var(--ok); color: #fff; }
.order-pool { display: flex; flex-wrap: wrap; gap: 8px; }
.ostep { border: 2.5px solid var(--ink); background: var(--card); border-radius: 14px; padding: 10px 14px; cursor: pointer; font-size: 17px; text-align: left; min-height: 48px; }
.ostep.shake { animation: shake .4s ease; border-color: var(--bad); }

/* Explique */
.explain .q { font-size: 18.5px; font-weight: 700; margin: 0 0 10px; }
.efield { display: grid; gap: 4px; margin-bottom: 10px; }
.efield label { font-family: var(--f-display); font-size: 15px; display: flex; align-items: center; gap: 8px; }
.efield label svg { width: 36px; height: 36px; background: var(--tile); border-radius: 50%; }
.efield textarea { width: 100%; min-height: 76px; border: 2.5px solid var(--line); border-radius: 14px; padding: 10px 12px; font: inherit; font-size: 18px; background: var(--paper); color: var(--ink); resize: vertical; }
.efield textarea:focus { border-color: var(--mustard); outline: none; }
.model { margin-top: 12px; background: var(--teal-soft); border-radius: 16px; padding: 12px 14px; animation: pop .3s ease; }
.model h4 { margin: 0 0 6px; font-family: var(--f-hand); font-weight: 400; font-size: 21px; }
.model p { margin: 4px 0; }
.model ul { margin: 8px 0 0; padding-left: 0; list-style: none; }
.model li { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; }
.model li input { width: 24px; height: 24px; flex: 0 0 auto; accent-color: var(--ok); margin-top: 1px; }
.hint-small { font-size: 14.5px; color: var(--ink-soft); }

/* Choix multiple */
.mopts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.mopt { border: 2.5px solid var(--ink); background: var(--card); border-radius: 14px; padding: 10px 14px; cursor: pointer; font-size: 17px; min-height: 48px; display: inline-flex; gap: 8px; align-items: center; }
.mopt::before { content: ""; width: 20px; height: 20px; border: 2.5px solid currentColor; border-radius: 5px; flex: 0 0 auto; }
.mopt[aria-pressed="true"] { background: var(--mustard-soft); border-color: var(--mustard); }
.mopt[aria-pressed="true"]::before { background: var(--ink); box-shadow: inset 0 0 0 3px var(--mustard-soft); }
.mopt.right { border-color: var(--ok); background: var(--ok-soft); }
.mopt.wrong { border-color: var(--bad); background: var(--bad-soft); }

/* Quiz */
.quiz .qcount { font-family: var(--f-display); font-size: 14px; color: var(--ink-soft); }
.quiz .qq { font-size: 20px; font-weight: 700; margin: 4px 0 12px; }
.qopts { display: grid; gap: 8px; }
.qopt { text-align: left; border: 2.5px solid var(--ink); background: var(--card); border-radius: 16px; padding: 12px 14px; font-size: 18px; cursor: pointer; display: flex; gap: 10px; align-items: center; min-height: 52px; }
.qopt .l { display: grid; place-items: center; width: 30px; height: 30px; flex: 0 0 auto; border-radius: 50%; background: var(--mustard); color: var(--on-color); font-family: var(--f-display); }
.qopt.right { border-color: var(--ok); background: var(--ok-soft); }
.qopt.wrong { border-color: var(--bad); background: var(--bad-soft); opacity: .9; }
.qopt:disabled { cursor: default; }
.qend { text-align: center; padding: 10px; }
.qend .stars { font-size: 44px; }
.qend p { font-family: var(--f-hand); font-size: 23px; margin: 6px 0 12px; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 2px; animation: fall 1.6s ease-in forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(540deg); } }
.dialog { margin-top: 10px; background: var(--bad-soft); border-radius: 14px; padding: 12px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .confetti { display: none; } }
@media (max-width: 480px) { body { font-size: 17px; } .act { padding: 12px; } .flips { grid-template-columns: 1fr 1fr; gap: 8px; } .flip, .flip .in { min-height: 200px; } .flip .front .ics svg { width: 56px; height: 56px; } .flip .back { font-size: 15px; padding: 8px; } .flip .front strong { font-size: 17px; } .bins { grid-template-columns: 1fr 1fr; } .tray { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .tray .chip { font-size: 15px; padding-right: 8px; } .tray .chip svg { width: 36px; height: 36px; } .tray .chip.txt { grid-column: 1 / -1; } .bins.match { grid-template-columns: 1fr; } .bin .bh { font-size: 16px; } .overall .bar { width: 80px; } .spot { min-width: 40px; min-height: 40px; font-size: 16px; } .spot.filled { font-size: 12.5px; padding: 2px 6px; } }
</style>

<script>(function () {
  'use strict';
  // ---------- utilitaires ----------
  const NNBSP = ' ', NBSP = ' ';
  const fr = s => String(s).replace(/ ([?!;])/g, NNBSP + '$1').replace(/ :/g, NBSP + ':').replace(/« /g, '«' + NBSP).replace(/ »/g, NBSP + '»');
  const esc = s => fr(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const $ = (sel, root = document) => root.querySelector(sel);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  const ic = (name, size) => iconSVG(name, size);
  const PRAISE = ['Bravo !', 'Exact !', 'Super !', 'Oui !', 'Bien joué !', 'Excellent !'];
  const praise = () => PRAISE[Math.floor(Math.random() * PRAISE.length)];
  const live = msg => { const l = $('#live'); if (l) { l.textContent = ''; setTimeout(() => { l.textContent = msg.replace(/<[^>]+>/g, ''); }, 30); } };
  const starsHTML = (n, max = 3) => `<span class="stars" aria-label="${n} étoile${n > 1 ? 's' : ''} sur ${max}">${'★'.repeat(n)}<span class="off">${'★'.repeat(max - n)}</span></span>`;

  // ---------- état (sauvegardé dans ce navigateur seulement) ----------
  const KEY = 'ema-animaux-queue-v1';
  let ST = { l: {} };
  try { const raw = localStorage.getItem(KEY); if (raw) ST = JSON.parse(raw) || ST; } catch (e) { /* stockage indisponible : on continue sans */ }
  if (!ST.l) ST.l = {};
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) { } };
  const LS = id => (ST.l[id] = ST.l[id] || { done: {}, stars: 0 });
  const lessonDone = L => L.acts.filter(a => LS(L.id).done[a.id]).length;
  const totalActs = LESSONS.reduce((n, L) => n + L.acts.length, 0);

  function updateOverall() {
    const d = LESSONS.reduce((n, L) => n + lessonDone(L), 0);
    const pct = Math.round(100 * d / totalActs);
    $('#ovTxt').textContent = pct + NBSP + '%';
    $('#ovBar').style.width = pct + '%';
  }

  // ---------- navigation ----------
  let current = 'home';
  function renderNav() {
    const nav = $('#nav'); nav.innerHTML = '';
    const mk = (id, inner, label) => {
      const b = el('button', null, inner); b.type = 'button'; b.setAttribute('aria-label', label);
      if (id === current) b.setAttribute('aria-current', 'page');
      b.addEventListener('click', () => go(id)); nav.appendChild(b);
    };
    mk('home', 'Accueil', 'Accueil');
    LESSONS.forEach((L, i) => {
      const s = LS(L.id).stars;
      mk(L.id, `<span class="ic">${ic(L.icon)}</span>${i + 1}${s ? `<span class="mini-stars">${'★'.repeat(s)}</span>` : ''}`, `Leçon ${i + 1} : ${fr(L.title)}`);
    });
    mk('rev', `<span class="ic">${ic('etoiledemer')}</span>Révision`, 'Révision éclair');
    const cur = nav.querySelector('[aria-current]'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  function go(id) {
    current = id; renderNav();
    if (id === 'home') renderHome(); else if (id === 'rev') renderRevision(); else renderLesson(LESSONS.find(L => L.id === id));
    updateOverall();
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
    const v = $('#view'); v.focus({ preventScroll: true });
  }

  // ---------- accueil ----------
  function renderHome() {
    const v = $('#view'); v.innerHTML = '';
    v.appendChild(el('p', 'hello', esc('Évaluation de sciences : jeudi 5 novembre. Fais une leçon à la fois, puis la révision éclair !')));
    const g = el('div', 'grid');
    LESSONS.forEach((L, i) => {
      const d = lessonDone(L), n = L.acts.length;
      const b = el('button', 'lcard', `<span class="big">${ic(L.icon)}</span>
        <h2><span class="num">${i + 1}</span>${esc(L.title)}</h2>
        <span class="pg">Éclair de génie, ${esc(L.pages)}</span>
        <span class="meta"><span class="bar"><i style="width:${Math.round(100 * d / n)}%"></i></span>${starsHTML(LS(L.id).stars)}</span>`);
      b.type = 'button'; b.addEventListener('click', () => go(L.id)); g.appendChild(b);
    });
    v.appendChild(g);
    const r = el('div', 'rev', `<div><h2>Révision éclair</h2><p>${esc('10 questions mélangées de toutes les leçons. Fais-la souvent !')}</p></div>`);
    const rb = el('button', 'btn', 'Commencer'); rb.type = 'button'; rb.addEventListener('click', () => go('rev')); r.appendChild(rb); v.appendChild(r);
    const f = el('div', 'foot', `<span>${esc('Ton progrès est gardé sur cet appareil.')}</span>`);
    const reset = el('button', 'btn alt', 'Recommencer'); reset.type = 'button';
    reset.addEventListener('click', () => confirmBox(f, 'Effacer tout ton progrès et toutes tes étoiles ?', () => { ST = { l: {} }; save(); go('home'); }));
    f.appendChild(reset); v.appendChild(f);
  }
  function confirmBox(host, msg, onYes) {
    if (host.querySelector('.dialog')) return;
    const d = el('div', 'dialog', `<p style="margin:0 0 8px">${esc(msg)}</p>`);
    const row = el('div', 'row');
    const y = el('button', 'btn', 'Oui, recommencer'); y.type = 'button'; y.addEventListener('click', onYes);
    const n = el('button', 'btn alt', 'Non'); n.type = 'button'; n.addEventListener('click', () => d.remove());
    row.append(y, n); d.appendChild(row); host.appendChild(d); y.focus();
  }

  // ---------- leçon ----------
  const TAGS = { flip: 'Cartes', sort: 'Classement', match: 'Association', label: 'Schéma', tf: 'Vrai ou faux', explain: 'Explique', order: 'Dans l’ordre', multi: 'Choix multiple', quiz: 'Quiz' };
  function renderLesson(L) {
    const v = $('#view'); v.innerHTML = '';
    const idx = LESSONS.indexOf(L);
    const head = el('div', 'lhead', `<span class="big">${ic(L.icon)}</span><div class="t"><h2><span class="num">${idx + 1}</span>${esc(L.title)}</h2><span class="pg">Éclair de génie, ${esc(L.pages)}</span></div>
      <div class="lprog"><span id="lpTxt"></span><span class="bar"><i id="lpBar"></i></span><span id="lpStars"></span></div>`);
    v.appendChild(head);
    v.appendChild(el('div', 'retenir', `<h3>À retenir</h3><ul>${L.retenir.map(r => `<li>${esc(r)}</li>`).join('')}</ul>`));
    const upd = () => {
      const d = lessonDone(L), n = L.acts.length;
      $('#lpTxt').textContent = `${d} / ${n} activités`;
      $('#lpBar').style.width = Math.round(100 * d / n) + '%';
      $('#lpStars').innerHTML = starsHTML(LS(L.id).stars);
      updateOverall();
    };
    L.acts.forEach((A, k) => v.appendChild(buildAct(L, A, k, upd)));
    const end = el('div', 'next-l');
    const rs = el('button', 'btn alt', 'Recommencer la leçon'); rs.type = 'button';
    rs.addEventListener('click', () => confirmBox(end, 'Recommencer cette leçon ? Tes réponses et tes étoiles de cette leçon seront effacées.', () => { ST.l[L.id] = { done: {}, stars: 0 }; save(); go(L.id); }));
    end.appendChild(rs);
    const nx = LESSONS[idx + 1];
    const nb = el('button', 'btn mus', nx ? `Leçon suivante : ${esc(nx.title)}` : 'Révision éclair'); nb.type = 'button';
    nb.addEventListener('click', () => go(nx ? nx.id : 'rev')); end.appendChild(nb);
    v.appendChild(end);
    upd();
  }

  function buildAct(L, A, k, upd) {
    const card = el('section', 'act' + (LS(L.id).done[A.id] ? ' done' : ''));
    card.setAttribute('aria-label', fr(A.title));
    const h = el('div', 'act-h', `<div><div class="tag">${esc(TAGS[A.type])}</div><h3>${esc(A.title)}</h3></div><span class="check" aria-hidden="true">✓</span>`);
    card.appendChild(h);
    if (A.help) card.appendChild(el('p', 'help', esc(A.help)));
    const body = el('div', 'body'); card.appendChild(body);
    const fbEl = el('div', 'fb'); fbEl.setAttribute('role', 'status'); card.appendChild(fbEl);
    const api = {
      fb(kind, html) { fbEl.className = 'fb show ' + kind; fbEl.innerHTML = html; live(html); },
      clearFb() { fbEl.className = 'fb'; fbEl.innerHTML = ''; },
      done() {
        const st = LS(L.id);
        const was = lessonDone(L) === L.acts.length;
        if (!st.done[A.id]) { st.done[A.id] = true; save(); }
        card.classList.add('done'); upd(); renderNavStarsOnly();
        if (!was && lessonDone(L) === L.acts.length) celebrate();
      },
      setStars(n) { const st = LS(L.id); st.stars = Math.max(st.stars || 0, n); save(); upd(); },
    };
    const build = () => { body.innerHTML = ''; api.clearFb(); BUILDERS[A.type](A, body, api); };
    build();
    if (A.type !== 'quiz' && A.type !== 'explain') {
      const redo = el('button', 'btn alt', 'Refaire pour t’entraîner'); redo.type = 'button';
      redo.style.cssText = 'margin-top:12px;min-height:40px;font-size:15px;padding:6px 14px';
      redo.addEventListener('click', build); card.appendChild(redo);
    }
    return card;
  }
  function renderNavStarsOnly() { renderNav(); }

  function celebrate() {
    const c = el('div', 'confetti'); const cols = ['#e6ac2e', '#b8d05a', '#2b8a84', '#d9503f', '#f2b01e'];
    for (let i = 0; i < 60; i++) { const p = el('i'); p.style.left = Math.random() * 100 + 'vw'; p.style.background = cols[i % cols.length]; p.style.animationDelay = Math.random() * .6 + 's'; c.appendChild(p); }
    document.body.appendChild(c); setTimeout(() => c.remove(), 2600);
  }

  // ---------- activités ----------
  const BUILDERS = {
    flip(A, body, api) {
      const wrap = el('div', 'flips'); const seen = new Set();
      A.cards.forEach((c, i) => {
        const b = el('button', 'flip', `<span class="in"><span class="face front"><span class="ics">${(c.icons || []).map(n => ic(n)).join('')}</span><strong>${esc(c.front)}</strong><small>Touche pour retourner</small></span><span class="face back">${esc(c.back)}</span></span>`);
        b.type = 'button'; b.setAttribute('aria-pressed', 'false');
        b.addEventListener('click', () => {
          const on = b.classList.toggle('on'); b.setAttribute('aria-pressed', on ? 'true' : 'false');
          if (on) { live(c.back); seen.add(i); b.classList.add('seen'); }
          if (seen.size === A.cards.length) { api.fb('ok', `<b>${esc('Tu as retourné toutes les cartes !')}</b> ${esc('Retourne-les encore et essaie de dire la réponse avant.')}`); api.done(); }
        });
        wrap.appendChild(b);
      });
      body.appendChild(wrap);
    },
    sort(A, body, api) { sorter(A, body, api, 'sort'); },
    match(A, body, api) { sorter(A, body, api, 'match'); },
    label(A, body, api) { sorter(A, body, api, 'label'); },

    tf(A, body, api) {
      const box = el('div', 'tf'); let left = A.items.length, good = 0;
      A.items.forEach(it => {
        const d = el('div', 'tfi', `<p>${esc(it.s)}</p>`); const row = el('div', 'row');
        [true, false].forEach(val => {
          const b = el('button', 'vf', val ? 'Vrai' : 'Faux'); b.type = 'button';
          b.addEventListener('click', () => {
            row.querySelectorAll('button').forEach(x => x.disabled = true);
            const ok = val === it.a; if (ok) good++;
            b.classList.add(ok ? 'pick-ok' : 'pick-bad'); d.classList.add(ok ? 'ok' : 'bad');
            const w = el('div', 'why', ok ? `<b>${esc(praise())}</b> ${esc(it.why)}` : `<b>${esc('Non, c’est ' + (it.a ? 'vrai' : 'faux') + '.')}</b> ${esc(it.why)}`);
            d.appendChild(w); live(w.innerHTML);
            if (--left === 0) {
              api.fb(good === A.items.length ? 'ok' : 'bad', good === A.items.length ? `<b>${esc('Parfait : ' + good + ' sur ' + A.items.length + ' !')}</b>` : `<b>${esc(good + ' sur ' + A.items.length + '.')}</b> ${esc('Relis les explications en rouge, puis touche « Refaire pour t’entraîner ».')}`);
              api.done();
            }
          });
          row.appendChild(b);
        });
        d.appendChild(row); box.appendChild(d);
      });
      body.appendChild(box);
    },

    order(A, body, api) {
      const slots = el('div', 'order-slots'); const pool = el('div', 'order-pool'); let next = 0;
      A.steps.forEach((s, i) => slots.appendChild(el('div', 'oslot', `<b>${i + 1}</b><span>…</span>`)));
      shuffle(A.steps.map((s, i) => i)).forEach(i => {
        const b = el('button', 'ostep', esc(A.steps[i].t)); b.type = 'button';
        b.addEventListener('click', () => {
          if (i === next) {
            const sl = slots.children[next]; sl.classList.add('filled'); sl.querySelector('span').innerHTML = esc(A.steps[i].t);
            b.remove(); next++;
            if (next === A.steps.length) { api.fb('ok', `<b>${esc(praise())}</b> ${esc('Toutes les étapes sont dans le bon ordre.')}`); api.done(); }
            else api.fb('ok', `<b>${esc(praise())}</b> ${esc('Quelle est l’étape ' + (next + 1) + ' ?')}`);
          } else {
            b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
            api.fb('bad', `<b>${esc('Pas encore.')}</b> ${esc(A.steps[i].hint)}`);
          }
        });
        pool.appendChild(b);
      });
      body.append(slots, pool);
    },

    explain(A, body, api) {
      const wrap = el('div', 'explain'); wrap.appendChild(el('p', 'q', esc(A.q)));
      const tas = A.fields.map((f, i) => {
        const id = `ex-${A.id}-${Math.random().toString(36).slice(2, 7)}-${i}`;
        const fd = el('div', 'efield', `<label for="${id}">${A.icons ? ic(A.icons[i]) : ''}${esc(f)}</label><textarea id="${id}" placeholder="${esc('Écris ta réponse ici…')}"></textarea>`);
        wrap.appendChild(fd); return fd.querySelector('textarea');
      });
      const row = el('div', 'row');
      const btn = el('button', 'btn mus', 'Voir un bon exemple'); btn.type = 'button'; btn.disabled = true;
      const hint = el('span', 'hint-small', esc('Écris d’abord ta réponse.'));
      row.append(btn, hint); wrap.appendChild(row);
      const ready = () => tas.every(t => t.value.trim().length >= 8);
      tas.forEach(t => t.addEventListener('input', () => { btn.disabled = !ready(); hint.hidden = ready(); }));
      btn.addEventListener('click', () => {
        if (!ready()) return;
        if (wrap.querySelector('.model')) return;
        const stamp = Date.now();
        const m = el('div', 'model', `<h4>Un exemple de bonne réponse</h4>${A.model.map(p => `<p>${esc(p)}</p>`).join('')}
          <p class="hint-small">${esc('Tes mots peuvent être différents. Ce qui compte, ce sont les idées. Coche ce qui est dans ta réponse :')}</p>
          <p class="hint-small">${esc('S’il manque une idée, ajoute-la dans ta réponse, puis coche la case.')}</p><ul>${A.check.map((c, i) => `<li><input type="checkbox" id="ck-${A.id}-${i}-${stamp}"><label for="ck-${A.id}-${i}-${stamp}">${esc(c)}</label></li>`).join('')}</ul>`);
        wrap.appendChild(m); btn.textContent = 'Exemple affiché'; btn.disabled = true;
        const boxes = m.querySelectorAll('input');
        boxes.forEach(bx => bx.addEventListener('change', () => {
          const all = [...boxes].every(x => x.checked);
          const n = [...boxes].filter(x => x.checked).length;
          if (all) { api.fb('ok', `<b>${esc(praise())}</b> ${esc('Ta réponse contient toutes les idées.')}`); api.done(); }
          else api.fb('info', esc(`Coche chaque idée que tu as écrite (${n} / ${boxes.length}).`));
        }));
      });
      body.appendChild(wrap);
    },

    multi(A, body, api) {
      body.appendChild(el('p', 'q', `<b>${esc(A.q)}</b>`));
      const box = el('div', 'mopts');
      const btns = shuffle(A.opts).map(o => {
        const b = el('button', 'mopt', esc(o.t)); b.type = 'button'; b.setAttribute('aria-pressed', 'false'); b._o = o;
        b.addEventListener('click', () => { if (finished) return; const p = b.getAttribute('aria-pressed') === 'true'; b.setAttribute('aria-pressed', p ? 'false' : 'true'); btns.forEach(x => x.classList.remove('wrong')); });
        box.appendChild(b); return b;
      });
      let finished = false;
      const chk = el('button', 'btn', 'Vérifier'); chk.type = 'button';
      chk.addEventListener('click', () => {
        const picked = btns.filter(b => b.getAttribute('aria-pressed') === 'true');
        const wrong = picked.filter(b => !b._o.ok);
        const missing = btns.filter(b => b._o.ok && b.getAttribute('aria-pressed') !== 'true').length;
        if (!wrong.length && !missing) {
          finished = true; btns.forEach(b => { if (b._o.ok) b.classList.add('right'); b.disabled = true; }); chk.disabled = true;
          api.fb('ok', `<b>${esc(praise())}</b> ${esc('Tu as trouvé toutes les bonnes réponses.')}`); api.done(); return;
        }
        wrong.forEach(b => b.classList.add('wrong'));
        let msg = `<b>${esc('Pas encore.')}</b> `;
        if (wrong.length) msg += wrong.map(b => esc(b._o.why)).join(' ');
        if (missing) msg += ' ' + esc(`Il manque encore ${missing} bonne${missing > 1 ? 's' : ''} réponse${missing > 1 ? 's' : ''}.`);
        api.fb('bad', msg);
      });
      body.append(box, chk);
    },

    quiz(A, body, api) { runQuiz(A.qs, body, api, { title: true, onEnd: (miss, n) => { const s = miss === 0 ? 3 : miss === 1 ? 2 : 1; api.setStars(s); api.done(); return s; } }); },
  };

  // ---------- tri, association, schéma (glisser OU toucher) ----------
  function sorter(A, body, api, mode) {
    let selected = null, left = A.items.length, mistakes = 0;
    const tray = el('div', 'tray');
    let binsBox;
    const spotEls = {};
    if (mode === 'label') {
      const dia = el('div', 'diagram', dogSkeletonSVG());
      A.bins.forEach(bn => {
        const [x, y] = DOG_PARTS[bn.key];
        const s = el('div', 'spot', esc(bn.label)); s.dataset.bin = bn.key; s.style.left = x + '%'; s.style.top = y + '%';
        s.tabIndex = 0; s.setAttribute('role', 'button'); s.setAttribute('aria-label', 'Cercle ' + bn.label);
        dia.appendChild(s); spotEls[bn.key] = s;
      });
      body.appendChild(dia); binsBox = dia;
    } else {
      binsBox = el('div', 'bins' + (mode === 'match' ? ' match' : ''));
      A.bins.forEach(bn => {
        const b = el('div', 'bin', `<div class="bh">${bn.icon ? ic(bn.icon) : ''}<span>${esc(bn.label)}${bn.sub ? `<small>${esc(bn.sub)}</small>` : ''}</span></div><div class="got"></div>`);
        b.dataset.bin = bn.key; b.tabIndex = 0; b.setAttribute('role', 'button'); b.setAttribute('aria-label', 'Boîte : ' + fr(bn.label));
        binsBox.appendChild(b);
      });
    }
    const markReady = on => binsBox.querySelectorAll('[data-bin]').forEach(b => { if (!b.classList.contains('filled')) b.classList.toggle('ready', on); });
    const select = (chip) => {
      if (selected === chip) { chip.classList.remove('sel'); selected = null; markReady(false); return; }
      if (selected) selected.classList.remove('sel');
      selected = chip; chip.classList.add('sel'); markReady(true);
      api.fb('ok', esc(mode === 'label' ? 'Maintenant, touche le bon cercle.' : 'Maintenant, touche la bonne boîte.'));
    };
    const attempt = (chip, binEl) => {
      const it = chip._it; if (binEl.classList.contains('filled')) return;
      if (selected) { selected.classList.remove('sel'); selected = null; markReady(false); }
      if (it.bin === binEl.dataset.bin) {
        chip.remove(); left--;
        if (mode === 'label') { binEl.classList.add('filled'); binEl.innerHTML = esc(it.label); binEl.removeAttribute('tabindex'); }
        else {
          const p = el('span', 'chip placed' + (it.icon ? '' : ' txt'), `${it.icon ? ic(it.icon) : ''}<span>${esc(it.label)}</span>`);
          binEl.querySelector('.got').appendChild(p);
          if (mode === 'match') binEl.classList.add('filled');
        }
        if (left === 0) {
          api.fb('ok', `<b>${esc(mistakes === 0 ? 'Parfait, sans erreur !' : 'Tout est bien placé !')}</b> ${esc(it.why)}`);
          api.done();
        } else api.fb('ok', `<b>${esc(praise())}</b> ${esc(it.why)}`);
      } else {
        mistakes++;
        chip.classList.remove('shake'); void chip.offsetWidth; chip.classList.add('shake');
        api.fb('bad', `<b>${esc('Pas tout à fait.')}</b> ${esc(it.why)} ${esc('Essaie encore !')}`);
      }
    };
    const binAt = (x, y) => { const e = document.elementFromPoint(x, y); const b = e && e.closest('[data-bin]'); return b && binsBox.contains(b) && !b.classList.contains('filled') ? b : null; };

    shuffle(A.items).forEach(it => {
      const chip = el('button', 'chip' + (it.icon ? '' : ' txt'), `${it.icon ? ic(it.icon) : ''}<span>${esc(it.label)}</span>`);
      chip.type = 'button'; chip._it = it;
      let down = null, ghost = null, hot = null, suppress = false, lastY = 0, raf = 0;
      const edgeScroll = () => {
        if (!ghost) { raf = 0; return; }
        const H = window.innerHeight, zone = 70;
        const dy = lastY > H - zone ? 14 : lastY < zone + 40 ? -14 : 0;
        if (dy) window.scrollBy(0, dy);
        raf = requestAnimationFrame(edgeScroll);
      };
      chip.addEventListener('pointerdown', e => {
        if (e.button > 0) return;
        down = { x: e.clientX, y: e.clientY, id: e.pointerId };
        try { chip.setPointerCapture(e.pointerId); } catch (_) { }
      });
      chip.addEventListener('pointermove', e => {
        if (!down || e.pointerId !== down.id) return;
        if (!ghost && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) {
          ghost = chip.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('sel', 'shake');
          ghost.style.width = chip.offsetWidth + 'px'; document.body.appendChild(ghost); chip.style.opacity = '.35';
        }
        if (ghost) {
          e.preventDefault(); lastY = e.clientY; if (!raf) raf = requestAnimationFrame(edgeScroll);
          ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
          const b = binAt(e.clientX, e.clientY);
          if (b !== hot) { if (hot) hot.classList.remove('hot'); hot = b; if (hot) hot.classList.add('hot'); }
        }
      });
      const end = (e, cancel) => {
        if (!down) return;
        const wasDrag = !!ghost;
        if (ghost) { ghost.remove(); ghost = null; chip.style.opacity = ''; }
        if (raf) { cancelAnimationFrame(raf); raf = 0; }
        if (hot) { hot.classList.remove('hot'); }
        const target = !cancel && wasDrag ? binAt(e.clientX, e.clientY) : null;
        hot = null; down = null;
        if (wasDrag) { suppress = true; setTimeout(() => { suppress = false; }, 350); if (target) attempt(chip, target); }
      };
      chip.addEventListener('pointerup', e => end(e, false));
      chip.addEventListener('pointercancel', e => end(e, true));
      chip.addEventListener('click', () => { if (suppress) return; select(chip); });
      tray.appendChild(chip);
    });
    binsBox.querySelectorAll('[data-bin]').forEach(b => {
      const act = () => { if (selected) attempt(selected, b); else if (!b.classList.contains('filled')) api.fb('ok', esc(mode === 'label' ? 'Choisis d’abord une étiquette en haut.' : 'Choisis d’abord une carte en haut.')); };
      b.addEventListener('click', act);
      b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
    });
    if (mode === 'label') { body.appendChild(tray); body.insertBefore(tray, binsBox); }
    else body.append(tray, binsBox);
  }

  // ---------- quiz ----------
  function runQuiz(qs, body, api, opts) {
    let i = 0, miss = 0; const order = shuffle(qs);
    const box = el('div', 'quiz'); body.appendChild(box);
    const show = () => {
      box.innerHTML = ''; api.clearFb();
      const Q = order[i]; let missedThis = false;
      box.appendChild(el('div', 'qcount', `Question ${i + 1} sur ${order.length}`));
      box.appendChild(el('p', 'qq', esc(Q.q)));
      const list = el('div', 'qopts');
      shuffle(Q.opts).forEach((o, k) => {
        const b = el('button', 'qopt', `<span class="l">${'ABCD'[k]}</span><span>${esc(o.t)}</span>`); b.type = 'button';
        b.addEventListener('click', () => {
          if (o.ok) {
            b.classList.add('right'); list.querySelectorAll('button').forEach(x => x.disabled = true);
            api.fb('ok', `<b>${esc(praise())}</b> ${esc(o.why || '')}`);
            const nb = el('button', 'btn', i + 1 < order.length ? 'Question suivante' : 'Voir mon résultat'); nb.type = 'button'; nb.style.marginTop = '12px';
            nb.addEventListener('click', () => { i++; if (i < order.length) show(); else finish(); });
            box.appendChild(nb); nb.focus({ preventScroll: true });
          } else {
            if (!missedThis) { missedThis = true; miss++; }
            b.classList.add('wrong'); b.disabled = true;
            api.fb('bad', `<b>${esc('Non.')}</b> ${esc(o.why || '')} ${esc('Essaie encore !')}`);
          }
        });
        list.appendChild(b);
      });
      box.appendChild(list);
    };
    const finish = () => {
      box.innerHTML = ''; api.clearFb();
      const good = order.length - miss;
      const s = opts.onEnd(miss, order.length);
      const msg = s === 3 ? 'Tout juste du premier coup !' : s === 2 ? 'Presque parfait !' : 'Continue, tu progresses !';
      const e = el('div', 'qend', `${starsHTML(s)}<p>${esc(msg)}</p><div>${esc(good + ' sur ' + order.length + ' du premier coup.')}</div>`);
      const again = el('button', 'btn alt', 'Recommencer le quiz'); again.type = 'button'; again.style.marginTop = '12px';
      again.addEventListener('click', () => { i = 0; miss = 0; order.splice(0, order.length, ...shuffle(qs)); show(); });
      e.appendChild(again); box.appendChild(e);
      if (s === 3) celebrate();
    };
    show();
  }

  // ---------- révision éclair ----------
  function revisionPool() {
    const pool = [];
    LESSONS.forEach(L => L.acts.forEach(A => {
      if (A.type === 'quiz') A.qs.forEach(q => pool.push(q));
      if (A.type === 'tf') A.items.forEach(t => pool.push({ q: 'Vrai ou faux ? ' + t.s, opts: [
        { t: 'Vrai', ok: t.a, why: t.a ? t.why : 'C’est faux. ' + t.why },
        { t: 'Faux', ok: !t.a, why: !t.a ? t.why : 'C’est vrai. ' + t.why }] }));
    }));
    return pool;
  }
  function renderRevision() {
    const v = $('#view'); v.innerHTML = '';
    v.appendChild(el('div', 'lhead', `<span class="big">${ic('etoiledemer')}</span><div class="t"><h2>Révision éclair</h2><span class="pg">${esc('10 questions de toutes les leçons')}</span></div>`));
    const card = el('section', 'act'); const body = el('div'); const fb = el('div', 'fb'); fb.setAttribute('role', 'status');
    card.append(body, fb); v.appendChild(card);
    const api = { fb(k, h) { fb.className = 'fb show ' + k; fb.innerHTML = h; live(h); }, clearFb() { fb.className = 'fb'; fb.innerHTML = ''; } };
    const start = () => { body.innerHTML = ''; runQuiz(shuffle(revisionPool()).slice(0, 10), body, api, { onEnd: miss => (miss === 0 ? 3 : miss <= 2 ? 2 : 1) }); };
    start();
    const row = el('div', 'next-l'); const nb = el('button', 'btn mus', 'Nouvelle révision'); nb.type = 'button'; nb.addEventListener('click', start);
    const hb = el('button', 'btn alt', 'Accueil'); hb.type = 'button'; hb.addEventListener('click', () => go('home'));
    row.append(hb, nb); v.appendChild(row);
  }

  // ---------- démarrage ----------
  const h = (location.hash || '').replace('#', '');
  go(LESSONS.some(L => L.id === h) || h === 'rev' ? h : 'home');
})();
</script>
